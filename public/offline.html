<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18785b" />
    <title>ROUTER | 오프라인</title>
    <style>
      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        box-sizing: border-box;
        margin: 0;
        padding: 24px;
        background: #f9fcfa;
        color: #17322a;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 28rem;
      }
      strong {
        color: #18785b;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        line-height: 1.65;
      }

      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.65rem 1rem;
        border-radius: 0.4rem;
        background: #18785b;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>ROUTER</strong>
      <h1>인터넷에 연결할 수 없습니다</h1>
      <p>연결을 확인한 뒤 다시 시도하면 지도와 보행 경로를 볼 수 있습니다.</p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
